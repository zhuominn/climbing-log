<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>攀岩记录（2026）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/primer-vars.css" />
  <link rel="stylesheet" href="assets/css/github-heatmap.css" />
</head>

<body data-year="2026">
  <div class="page">
    <header>
      <h1>Zhuomin's Climbing Log</h1>
      <p>Always climb with a beginner's mind.</p>

      <div style="margin-top: 10px; display:flex; gap:8px; flex-wrap: wrap; align-items:center;">
        <span style="flex:1"></span>

        <span id="session-status" class="tag">未登录</span>
        <a id="session-login-link" class="btn-secondary" href="./login.html?next=2026.html" style="text-decoration:none;">去登录</a>
        <button id="session-logout-btn" class="btn-secondary" style="display:none;">退出</button>
      </div>
    </header>

    <section class="card">
      <h2 class="card-title"><span class="icon">🟩</span>Climbs in 2026</h2>
      <div id="heatmap-2026" class="heatmap-root">
      <div class="heatmap-header">
        <div class="heatmap-header-left">
          <div class="heatmap-title">2026 Heatmap</div>
        </div>
        <div class="heatmap-year-switch" aria-label="Select year"></div>
      </div>
      <div class="gh-heatmap">
        <!-- Month labels -->
        <div class="gh-months" id="gh-months-2026" aria-hidden="true"></div>

        <!-- Weekday labels (GitHub style: Mon/Wed/Fri only) -->
        <div class="gh-days" aria-hidden="true">
          <div class="gh-day">Mon</div>
          <div class="gh-day">Wed</div>
          <div class="gh-day">Fri</div>
        </div>

        <!-- Grid cells: JS renders cells here -->
        <div class="heatmap-grid" id="gh-grid-2026"></div>
      </div>

      <div class="heatmap-legend" aria-hidden="true">
        <span>Less</span>
        <span class="heatmap-legend-cell"></span>
        <span class="heatmap-legend-cell lvl-1"></span>
        <span class="heatmap-legend-cell lvl-2"></span>
        <span class="heatmap-legend-cell lvl-3"></span>
        <span class="heatmap-legend-cell lvl-4"></span>
        <span>More</span>
      </div>

      <!-- Tooltip: optional, JS may create one (GitHub-like) -->
      <div class="heatmap-tooltip" id="gh-tooltip-2026" style="display:none;"></div>
    </div>


    </section>

    <section class="card">
      <h2 class="card-title"><span class="icon">📅</span>攀岩日历（2026）</h2>
      <div class="calendar-layout">
        <div id="calendar-2026"></div>
        <div class="month-tabs" id="month-tabs-2026">
          <button class="month-tab" data-month="0">Jan</button>
          <button class="month-tab" data-month="1">Feb</button>
          <button class="month-tab" data-month="2">Mar</button>
          <button class="month-tab" data-month="3">Apr</button>
          <button class="month-tab" data-month="4">May</button>
          <button class="month-tab" data-month="5">Jun</button>
          <button class="month-tab" data-month="6">Jul</button>
          <button class="month-tab" data-month="7">Aug</button>
          <button class="month-tab" data-month="8">Sep</button>
          <button class="month-tab" data-month="9">Oct</button>
          <button class="month-tab" data-month="10">Nov</button>
          <button class="month-tab" data-month="11">Dec</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title"><span class="icon">🧗‍♀️</span>攀岩训练明细</h2>

      <div style="margin-bottom: 10px; display: flex; gap: 8px; flex-wrap: wrap;">
        <button id="add-row-btn" class="btn-secondary">+ 新增一行记录</button>
        <button id="save-new-rows-btn" class="btn-secondary">💾 保存新记录到云端</button>
        <button id="save-edits-btn" class="btn-secondary">✅ 保存已修改行</button>
        <button id="delete-selected-btn" class="btn-secondary">🗑 删除当前选中行</button>

        <button id="generate-share-btn" class="btn-secondary" style="display:none;">🔗 生成分享链接</button>
        <button id="copy-share-btn" class="btn-secondary" style="display:none;">📋 复制分享链接</button>
      </div>

      <table class="log-table">
        <thead>
          <tr>
            <th style="width: 40px;">序号</th>
            <th style="width: 90px;">日期</th>
            <th style="width: 80px;">时长</th>
            <th>训练内容</th>
            <th style="width: 150px;">完成情况</th>
            <th style="width: 130px;">备注</th>
          </tr>
        </thead>
        <tbody id="log-tbody"></tbody>
      </table>
    </section>
  </div>

  <!-- Keep ESM entry only; legacy scripts removed -->
  <script type="module" src="assets/js/pages/year.page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>重置密码 - 攀岩日志</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
  <div class="page">
    <header>
      <h1>重置密码</h1>
      <p class="note">请通过邮件里的链接打开本页面，然后设置新密码。</p>
    </header>

    <section class="card">
      <div class="auth-row">
        <span id="rp-status">检测恢复链接中…</span>
      </div>

      <div id="rp-form" style="display:none;">
        <div class="auth-row">
          <input id="rp-password" type="password" placeholder="新密码（至少 6 位）" autocomplete="new-password" />
          <input id="rp-password2" type="password" placeholder="确认新密码" autocomplete="new-password" />
          <button id="rp-submit" class="btn-secondary">更新密码</button>
        </div>
        <p class="note" id="rp-hint"></p>
      </div>

      <div style="margin-top: 8px; display:flex; gap:8px; flex-wrap: wrap;">
        <a class="btn-secondary" href="./login.html" style="text-decoration:none;">返回登录</a>
        <a class="btn-secondary" href="./2026.html" style="text-decoration:none;">去 2026</a>
      </div>
    </section>
  </div>

  <script type="module" src="assets/js/pages/resetPassword.page.js"></script>
</body>
</html>
